<!-- Create a React form which accepts Name,Rollno and totalmarks,on 
submitting the form it should be saved in data table inside MongoDB 
database named student. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST" action="/submit">
        <input type="text" placeholder="Name" name="name">
        <input type="text" placeholder="Roll No" name="rollno">
        <input type="text" placeholder="Total Marks" name="totalmarks">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
